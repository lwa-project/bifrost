---
name: "Build and Test"
"on": [push, pull_request]
jobs:
  pre_build:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content'
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'
  build:
    needs: pre_build
    if: ${{ needs.pre_build.outputs.should_skip != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The self-hosted GPU runner is only included when the repository
        # variable ENABLE_SELF_HOSTED is set to 'true'.
        os: ${{ fromJSON(vars.ENABLE_SELF_HOSTED == 'true' && '["self-hosted", "ubuntu-latest", "macos-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        python-version: ['3.8', '3.10', '3.12']
        numpy: ['numpy<2']
        exclude:
          # Python 3.8 is not available for ubuntu-latest (26.04)
          - os: ubuntu-latest
            python-version: '3.8'
        include:
          - os: ubuntu-22.04
            python-version: '3.8'
            numpy: 'numpy<2'
          - os: ubuntu-latest
            python-version: '3.12'
            numpy: 'numpy>=2'
      fail-fast: false
    steps:
      - name: "Software Install - Ubuntu"
        if: ${{ startsWith(matrix.os, 'ubuntu') || matrix.os == 'self-hosted' }}
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            curl \
            universal-ctags \
            gfortran \
            git \
            libhwloc-dev \
            libopenblas-dev \
            libtool \
            pkg-config \
            software-properties-common
      - name: "Software Install - MacOS"
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew install \
            curl \
            gawk \
            gnu-sed \
            hwloc \
            pkg-config \
            universal-ctags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Software Install - Python"
        # Note: scipy is installed here so that pip resolves it against the
        #       numpy version pin instead of upgrading numpy later on.
        run: python -m pip install \
               setuptools \
               "${{ matrix.numpy }}" \
               scipy \
               matplotlib \
               contextlib2 \
               simplejson \
               pint \
               graphviz \
               ctypesgen==1.0.2 \
               pylint \
               coverage
      - name: "Software Install - Python, part 2"
        if: ${{ matrix.os == 'self-hosted' }}
        # Setting CPLUS_INCLUDE_PATH helps pycuda find the right
        # Python header files <pyconfig.h> to use with its embedded
        # subset of Boost.
        env:
          CPLUS_INCLUDE_PATH: "${{ env.pythonLocation }}/include/python\
            ${{ matrix.python-version }}"
        run: |
          if [ "${{ matrix.python-version }}" = "3.8" ]; then
            python -m pip install pycuda==2025.1.2
          else
            python -m pip install pycuda
          fi
          python -m pip install \
               cupy-cuda12x \
               numba \
               jupyterlab \
               jupyter_client \
               nbformat \
               nbconvert
      - name: "Software Install - PSRDADA"
        if: ${{ matrix.os == 'self-hosted' }}
        run: |
          git clone git://git.code.sf.net/p/psrdada/code psrdada
          cd psrdada
          ./bootstrap
          ./configure
          make -j all
          sudo make install
          cd ..
      - uses: actions/checkout@v4
      - name: "Build and Install"
        run: |
          ./configure
          make -j all
          sudo make install
      - name: Test
        env:
          LD_LIBRARY_PATH: /usr/local/lib:${{ env.LD_LIBRARY_PATH }}
        run: |
          cd test
          bash ./download_test_data.sh
          python -c "from bifrost import telemetry; telemetry.disable()"
          coverage run --source=bifrost \
            -m unittest discover
          coverage xml
      - name: "Test, part 2"
        if: ${{ matrix.os == 'self-hosted' }}
        env:
          LD_LIBRARY_PATH: /usr/local/lib:${{ env.LD_LIBRARY_PATH }}
        run: |
          cd testbench
          python generate_test_data.py
          coverage run --source=bifrost test_file_read_write.py
          coverage run --source=bifrost test_fft.py
          coverage run --source=bifrost your_first_block.py
          python download_breakthrough_listen_data.py -y
          coverage run --source=bifrost test_fdmt.py ./testdata/pulsars/blc0_guppi_57407_61054_PSR_J1840%2B5640_0004.fil
          coverage xml
      - name: "Upload Coverage"
        env:
          UNITTEST_OS: ${{ matrix.os }}
          UNITTEST_PY: ${{ matrix.python-version }}
        if: ${{ matrix.os == 'self-hosted' && matrix.python-version == '3.8' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test/coverage.xml, ./testbench/coverage.xml
          env_vars: UNITTEST_OS,UNITTEST_PY
          fail_ci_if_error: false
          verbose: true
